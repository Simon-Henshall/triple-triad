# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: http://127.0.0.1:8080
      DB_HOST: 127.0.0.1
      DB_NAME: triple_triad
      DB_USER: triple_triad_ci
      DB_PASS: triple_triad_ci_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: triple_triad
          MYSQL_USER: triple_triad_ci
          MYSQL_PASSWORD: triple_triad_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.2"
          extensions: pdo_mysql
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run build --if-present
      - name: Seed test database
        run: mysql --protocol=TCP -h 127.0.0.1 -utriple_triad_ci -ptriple_triad_ci_password < back_end/sql/run_all.sql
      - name: Start PHP server
        run: php -S 127.0.0.1:8080 -t . > php-server.log 2>&1 &
      - run: npm test
      - name: Upload test coverage
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@af2c6347526edfe5ff45ad690affad475d77ddb4
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
